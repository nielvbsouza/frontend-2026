<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade Prática JavaScript</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
    <h1>Laboratório de Programação FrontEnd</h1>
    <p>Exercícios de JavaScript</p>
</header>


<div class="card">

    <h2>⚡ Exercício 01 - Validador de CPF</h2>

    <input type="text" id="cpf" placeholder="Digite o CPF">

    <button onclick="validarCPF()">Validar CPF</button>

    <div id="resultadoCPF"></div>

</div>


<div class="card">

    <h2>🌡️ Exercício 02 - Conversor Dinâmico</h2>

    <div class="campo-duplo">

        <div>
            <label>Celsius</label>
            <input type="number" id="celsius" step="0.1">
        </div>

        <div>
            <label>Fahrenheit</label>
            <input type="number" id="fahrenheit" step="0.1">
        </div>

    </div>

</div>


<div class="card">

    <h2>🎓 Exercício 03 - Média Escolar</h2>

    <input type="text" id="nomeAluno" placeholder="Nome do aluno">

    <input type="number" id="nota1" placeholder="Nota 1">

    <input type="number" id="nota2" placeholder="Nota 2">

    <input type="number" id="nota3" placeholder="Nota 3">

    <button onclick="calcularMedia()">Calcular Média</button>

    <div id="resultadoMedia"></div>

</div>


<div class="card">

    <h2>💳 Exercício 04 - Infinity Bank</h2>

    <label>Bandeira</label>

    <select id="bandeira">
        <option value="visa">Visa</option>
        <option value="master">Master</option>
        <option value="elo">Elo</option>
    </select>

    <input type="number" id="valorVenda" placeholder="Valor da venda">

    <input type="number" id="parcelas" placeholder="Quantidade de parcelas">

    <button onclick="calcularVenda()">Calcular</button>

    <div id="resultadoBanco"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
